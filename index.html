
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Location Website</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #111;
}

#background {
  position: fixed;
  inset: 0;
  background-image: url("background.jpg");
  background-size: cover;
  background-position: center;
}

#consent {
  position: fixed;
  inset: 0;
  z-index: 5;
  background: rgba(0,0,0,0.85);
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 30px;
  text-align: center;
}

#consent button {
  padding: 15px 30px;
  margin: 10px;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
}

#allow {
  background: #2563eb;
  color: white;
}

#decline {
  background: #444;
  color: white;
}

#top {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 50%;
  z-index: 2;
  cursor: pointer;
}

#status {
  position: absolute;
  bottom: 30px;
  width: 100%;
  text-align: center;
  color: white;
  z-index: 3;
  text-shadow: 0 1px 5px black;
}
</style>
</head>

<body>

<div id="background"></div>

<div id="consent">
  <h2>Location sharing</h2>

  <p>
    This website can share your precise device location
    with trajectory.aerospace@gmail.com by email
    when you tap the upper half of the screen.
  </p>

  <button id="allow">Agree and enable location</button>
  <button id="decline">Decline</button>
</div>

<div id="top"></div>
<div id="status">Waiting for permission</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>

<script>
const SERVICE_ID = "service_m7tu3mv";
const TEMPLATE_ID = "template_xbjg8ir";
const PUBLIC_KEY = "rFNWrRO-NZBWQi9QH";

emailjs.init({
  publicKey: PUBLIC_KEY
});

let locationEnabled = false;
let sending = false;

const consent = document.getElementById("consent");
const status = document.getElementById("status");
const topArea = document.getElementById("top");

document.getElementById("allow").addEventListener("click", () => {

  if (!navigator.geolocation) {
    status.textContent = "Location is not supported.";
    return;
  }

  navigator.geolocation.getCurrentPosition(
    () => {
      locationEnabled = true;
      consent.style.display = "none";
      status.textContent = "Ready";
    },
    () => {
      locationEnabled = false;
      status.textContent = "Location permission was not granted.";
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
});

document.getElementById("decline").addEventListener("click", () => {
  consent.style.display = "none";
  status.textContent = "Location sharing is disabled.";
});

topArea.addEventListener("click", async () => {

  if (!locationEnabled || sending) return;

  sending = true;
  status.textContent = "Getting location...";

  navigator.geolocation.getCurrentPosition(
    async (position) => {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      const mapsLink =
        `https://www.google.com/maps?q=${latitude},${longitude}`;

      try {

        await emailjs.send(
          SERVICE_ID,
          TEMPLATE_ID,
          {
            message: "hi",
            latitude: latitude,
            longitude: longitude,
            accuracy: accuracy,
            maps_link: mapsLink
          }
        );

        status.textContent = "Sent successfully!";

      } catch (error) {

        console.error(error);
        status.textContent = "Email failed to send.";

      }

      sending = false;

    },

    () => {
      status.textContent = "Could not retrieve location.";
      sending = false;
    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );

});
</script>

</body>
</html>
