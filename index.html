
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Emergency Assistance</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #111;
}

#background {
  position: fixed;
  inset: 0;
  background: url("image.jpeg") center / cover no-repeat;
}

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.2);
}

.zone {
  position: absolute;
  width: 100%;
  height: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  padding: 25px;
  font-size: 23px;
  font-weight: bold;
  text-shadow: 0 2px 8px black;
  cursor: pointer;
  user-select: none;
}

#top {
  top: 0;
}

#bottom {
  bottom: 0;
}

#status {
  position: fixed;
  bottom: 10px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 12px;
  z-index: 4;
  text-shadow: 0 1px 5px black;
}
</style>
</head>

<body>

<div id="background"></div>
<div id="overlay"></div>

<div class="zone" id="top">
</div>

<div class="zone" id="bottom">
</div>


<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>

<script>
const SERVICE_ID = "service_m7tu3mv";
const TEMPLATE_ID = "template_xbjg8ir";
const PUBLIC_KEY = "rFNWrRO-NZBWQi9QH";

emailjs.init({ publicKey: PUBLIC_KEY });

let sending = false;

async function sendAlert(message) {

  if (sending) return;

  if (!navigator.geolocation) {
    alert("Location is not supported by this browser.");
    return;
  }

  const consent = confirm(
    "This alert will send your selected emergency message and precise device location to trajectory.aerospace@gmail.com. Continue?"
  );

  if (!consent) return;

  sending = true;

  const status = document.getElementById("status");
  status.textContent = "Getting location...";

  navigator.geolocation.getCurrentPosition(
    async (position) => {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      const mapsLink =
        `https://www.google.com/maps?q=${latitude},${longitude}`;

      try {

        await emailjs.send(
          SERVICE_ID,
          TEMPLATE_ID,
          {
            message: message,
            latitude: latitude,
            longitude: longitude,
            accuracy: accuracy,
            maps_link: mapsLink
          }
        );

        status.textContent = "Alert sent successfully.";

      } catch (error) {

        console.error(error);
        status.textContent = "Failed to send alert.";

      }

      sending = false;
    },

    (error) => {

      console.error(error);
      status.textContent = "Unable to obtain location.";
      sending = false;

    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 30000
    }
  );
}

document.getElementById("top").addEventListener("click", () => {
  sendAlert("SOS, HELP ME, THERES SOMETHING WRONG OR IM IN DANGER");
});

document.getElementById("bottom").addEventListener("click", () => {
  sendAlert("HELP ME, SOS, THERES WEIRD PERSON, IM SCARED.");
});
</script>

</body>
</html>
